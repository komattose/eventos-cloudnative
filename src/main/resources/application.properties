spring.application.name=eventos
server.port=${PORT:8080}

# --- Oracle Cloud (Autonomous Database) ---
# Los datos de conexión se entregan por variables de entorno; nunca se suben al repositorio.
#   DB_URL      ej: jdbc:oracle:thin:@nombrebd_high?TNS_ADMIN=/app/wallet
#   DB_USERNAME ej: ADMIN
#   DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Crea/actualiza las tablas EVENTOS y COMPRAS automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Endpoint /actuator/health para verificar el despliegue en EC2
management.endpoints.web.exposure.include=health,info

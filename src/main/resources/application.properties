spring.application.name=eventos
server.port=${PORT:8080}

# --- Oracle Cloud (Autonomous Database) ---
# Los datos de conexión se entregan por variables de entorno; nunca se suben al repositorio.
#   DB_URL      ej: jdbc:oracle:thin:@nombrebd_high?TNS_ADMIN=/app/wallet
#   DB_USERNAME ej: ADMIN
#   DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Crea/actualiza las tablas EVENTOS y COMPRAS automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.jackson.serialization.write-dates-as-timestamps=false

# --- AWS S3 (semana 2) ---
# Bucket donde se guardan los resúmenes de compra: {numeroResumen}/resumen-compra-{numeroResumen}.pdf
aws.s3.bucket=${S3_BUCKET:}
aws.region=${AWS_REGION:us-east-1}
# Credenciales de AWS Academy ("AWS Details"). Si se dejan vacías se usa el rol de la instancia (LabRole).
aws.credentials.access-key=${AWS_ACCESS_KEY_ID:}
aws.credentials.secret-key=${AWS_SECRET_ACCESS_KEY:}
aws.credentials.session-token=${AWS_SESSION_TOKEN:}

# --- Amazon EFS (semana 3) ---
# Carpeta donde se generan los tickets (almacenamiento temporal). En la EC2 es el EFS montado en /mnt/efs,
# que se monta en el contenedor en /app/efs. En local se usa una carpeta del proyecto.
efs.path=${EFS_PATH:./efs-data}
# Al generar los tickets se suben automáticamente a S3: evento{eventoId}/{usuario}/ticket{id}.pdf
tickets.subida-automatica=${TICKETS_SUBIDA_AUTOMATICA:true}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Endpoint /actuator/health para verificar el despliegue en EC2
management.endpoints.web.exposure.include=health,info
